<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>跨平台视频 · 播放测试</title><style>*{box-sizing:border-box}body{margin:0;background:#101113;color:#f5f5f2;font:15px system-ui}header{padding:22px 5%;border-bottom:1px solid #313333;display:flex;justify-content:space-between;align-items:center}header b{font-size:20px}header span,.muted{color:#a4aaa6}main{max-width:1100px;margin:28px auto;padding:0 22px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{border:1px solid #464b47;background:#202321;color:#eee;border-radius:24px;padding:9px 15px;cursor:pointer}button.active{background:#d2f96a;color:#17200a;border-color:#d2f96a}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px}.player{height:min(68vh,680px);min-height:420px;background:#080909;border:1px solid #363a37;border-radius:20px;overflow:hidden;display:flex;align-items:center;justify-content:center}iframe{width:100%;height:100%;border:0}.fallback{text-align:center;padding:30px;line-height:1.8}.side{padding:12px 0}.tag{color:#d2f96a;letter-spacing:.08em;font-size:12px}.side h2{line-height:1.5}.controls{display:flex;gap:8px;margin:25px 0}a{color:#d2f96a}small{display:block;color:#a4aaa6;line-height:1.7;margin-top:24px}.queue{border-top:1px solid #363a37;padding-top:15px}.queue div{margin:12px 0 22px;color:#bbb;white-space:pre-wrap;line-height:1.65;overflow-wrap:anywhere} @media(max-width:700px){.layout{grid-template-columns:1fr}.player{height:60vh;min-height:380px}header span{display:none}} </style><header><b>◉ 视频播放实验室</b><span>飞书表格 · 实时读取</span></header><main><h1>跨平台，逐条看。</h1><p class="muted">选择平台，测试页面内播放与切换体验。</p><div class="filters" id="filters"></div><p id="status" class="muted">正在读取飞书表格…</p><button id="refresh">刷新表格</button><div class="layout"><div class="player" id="player"></div><div class="side"><div class="tag" id="meta"></div><h2 id="title"></h2><a id="original" target="_blank" rel="noopener noreferrer">在原平台打开 ↗</a><div class="controls"><button id="prev">↑ 上一条</button><button id="next">↓ 下一条</button></div><div class="queue"><b>视频爆了</b><div id="stats"></div><b>评论区佐证</b><div id="comments"></div></div></div></div></main><script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script><script>let data=[],pool=[],index=0,filter='全部';const $=s=>document.querySelector(s);function embed(x){let u=new URL(x.url),m;if(x.platform==='B站'&&(m=u.pathname.match(/(BV[\w]+)/i)))return 'https://player.bilibili.com/player.html?bvid='+m[1]+'&autoplay=0';if(x.platform==='TikTok'&&(m=u.pathname.match(/video\/(\d+)/)))return 'https://www.tiktok.com/player/v1/'+m[1]+'?autoplay=0';if(x.platform==='Instagram'&&(m=u.pathname.match(/\/(reel|p)\/([^/]+)/)))return 'https://www.instagram.com/p/'+m[2]+'/embed/captioned/';if(x.platform==='抖音'&&(m=u.pathname.match(/video\/(\d+)/)))return 'https://open.douyin.com/player/video?vid='+m[1]+'&autoplay=0';if(x.platform==='YouTube'){let id=u.searchParams.get('v')||u.pathname.split('/').filter(Boolean).pop();return 'https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?autoplay=0'}return null}function render(){let x=pool[index];if(!x){$('#player').textContent='没有可播放的视频';$('#title').textContent='暂无内容';return;}$('#meta').textContent=x.platform+' / '+(index+1)+' · '+pool.length;$('#title').textContent=x.title;$('#original').href=x.url;let src=embed(x),pl=$('#player');pl.replaceChildren();if(x.platform==='X'){let m=x.url.match(/status\/(\d+)/);let d=document.createElement('div');d.style.cssText='overflow:auto;max-height:100%;padding:20px;width:100%';d.textContent='正在加载 X 帖子；如果长时间没有显示，请打开原帖。';pl.append(d);if(m){let start=Date.now();let timer=setInterval(()=>{if(!d.isConnected){clearInterval(timer);return}if(window.twttr&&twttr.widgets){clearInterval(timer);d.textContent='';twttr.widgets.createTweet(m[1],d,{theme:'dark',conversation:'none'}).then(v=>{if(!v)d.textContent='此帖子无法嵌入，请打开原帖。'}).catch(()=>{d.textContent='加载失败，请打开原帖。'})}else if(Date.now()-start>12000){clearInterval(timer);d.textContent='X 播放器加载失败，请打开原帖。'}},250)}}else if(src){let f=document.createElement('iframe');f.src=src;f.title=x.platform+' 视频';f.allow='encrypted-media; picture-in-picture; fullscreen';f.referrerPolicy=x.platform==='抖音'?'unsafe-url':'strict-origin-when-cross-origin';pl.append(f)}else{let d=document.createElement('div');d.className='fallback';d.textContent=x.platform+' 的页面内播放方式尚未验证，请使用右侧原链接打开。';pl.append(d)}$('#stats').textContent=x.stats||'暂无数据';$('#comments').textContent=x.comments||'暂无数据';$('#filters').replaceChildren(...['全部',...new Set(data.map(d=>d.platform))].map(p=>{let b=document.createElement('button');b.textContent=p;b.className=p===filter?'active':'';b.onclick=()=>{filter=p;pool=p==='全部'?data:data.filter(x=>x.platform===p);index=0;render()};return b}))}function step(n){index=Math.max(0,Math.min(pool.length-1,index+n));render()}$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();step(1)}if(e.key==='ArrowUp'){e.preventDefault();step(-1)}});let lock=0; document.addEventListener("wheel",e=>{if(Math.abs(e.deltaY)>40 && Date.now()-lock>900){lock=Date.now();step(e.deltaY>0?1:-1)}},{passive:true}); let sy=0;document.addEventListener("touchstart",e=>sy=e.touches[0].clientY,{passive:true});document.addEventListener("touchend",e=>{let d=sy-e.changedTouches[0].clientY;if(Math.abs(d)>70)step(d>0?1:-1)},{passive:true});async function refresh(){let status=$('#status');status.textContent='正在读取飞书表格…';$('#refresh').disabled=true;try{let res=await fetch('/api/videos',{cache:'no-store'});let payload=await res.json();if(!res.ok)throw Error(payload.error||'读取失败');let current=pool[index]?.url;data=payload.items;pool=filter==='全部'?data:data.filter(x=>x.platform===filter);index=Math.max(0,pool.findIndex(x=>x.url===current));status.textContent='已更新 · '+data.length+' 条视频 · '+new Date().toLocaleTimeString();render()}catch(e){status.textContent=e.message+' 请确认已在本机登录飞书，并有该表格的读取权限，然后重试。'}finally{$('#refresh').disabled=false}}$('#refresh').onclick=refresh;refresh();</script></html>
